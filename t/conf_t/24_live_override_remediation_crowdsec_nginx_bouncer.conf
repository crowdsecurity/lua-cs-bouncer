ENABLED=true
API_URL=http://127.0.0.1:8081
API_KEY=LFrdL+aiecMTSxpGE9vLkx5sGMwdIpgVovpVMfXp3J0
CACHE_EXPIRATION=1
# bounce for all type of remediation that the bouncer can receive from the local API
BOUNCING_ON_TYPE=all
FALLBACK_REMEDIATION=ban
OVERRIDE_REMEDIATION=captcha
REQUEST_TIMEOUT=3000
UPDATE_FREQUENCY=10
# live or stream
MODE=live
# exclude the bouncing on those location
# the bouncer's own call to the cap instance must be excluded, otherwise verification
# is bounced back to the captcha page and the user can never get through
EXCLUDE_LOCATION=/v1/decisions,/capsitekey/siteverify
#those apply for "ban" action
# /!\ REDIRECT_LOCATION and RET_CODE can't be used together. REDIRECT_LOCATION take priority over RET_CODE
BAN_TEMPLATE_PATH=./ban
REDIRECT_LOCATION=
RET_CODE=
#those apply for "captcha" action
#valid providers are recaptcha, hcaptcha, turnstile, cap
CAPTCHA_PROVIDER=cap
# Captcha Secret Key
SECRET_KEY=capsecret
# Captcha Site key
SITE_KEY=capsitekey
CAPTCHA_TEMPLATE_PATH=templates/captcha.html
CAPTCHA_EXPIRATION=3600
CAPTCHA_API_ENDPOINT=https://cap.example.com
CAPTCHA_VERIFY_ENDPOINT=http://127.0.0.1:8081
